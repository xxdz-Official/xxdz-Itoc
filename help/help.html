    <style>
        * { box-sizing: border-box; font-family: "Consolas", "Microsoft YaHei", "Segoe UI", sans-serif; }
        body { margin: 0; padding: 0; background: #f4f0fa; color: #333; line-height: 1.8; height: 100vh; display: flex; flex-direction: column; }

        /* 顶栏 */
        .header-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 28px; background: #fff; border-bottom: 2px solid #d8cfef;
            flex-wrap: wrap; gap: 12px; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 40px; height: 40px; object-fit: contain; border: 1px solid #ddd; }
        .logo-area h1 { font-size: 24px; color: #333; margin: 0; letter-spacing: 1px; }
        .top-bar { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ===== 向上扫描按钮 ===== */
        .top-bar a {
            color: #555; text-decoration: none; font-size: 14px;
            padding: 6px 14px; border: 1px solid #ddd; background: #fff;
            white-space: nowrap;
            position: relative; overflow: hidden;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .top-bar a span { position: relative; z-index: 1; }
        .top-bar a::before {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0; top: 0;
            background: #AB92F5;
            transform: translateY(100%);
            transition: transform 0.25s ease;
        }
        .top-bar a:hover::before,
        .top-bar a.active::before { transform: translateY(0%); }
        .top-bar a:hover { color: #fff; border-color: #AB92F5; }
        .top-bar a.active { color: #fff; border-color: #AB92F5; }

        /* 主容器 */
        .main-container {
            display: flex; flex: 1; overflow: hidden;
            padding: 16px 24px; gap: 20px; background: #f4f0fa;
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px; min-width: 220px; background: #fff;
            border: 1px solid #e0d8f0;
            padding: 16px 0; overflow-y: auto; flex-shrink: 0; height: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .sidebar h3 {
            font-size: 15px; margin: 0 0 10px 0; color: #666;
            padding: 0 20px 12px 20px; border-bottom: 1px solid #f0eaf8;
            letter-spacing: 2px; font-weight: 500;
        }
        .sidebar ul { list-style: none; margin: 0; padding: 0; }

        /* ===== 侧边栏向上扫描 ===== */
        .sidebar li {
            padding: 10px 20px; cursor: pointer; font-size: 14px; color: #555;
            border-left: 3px solid transparent;
            margin: 2px 8px;
            position: relative; overflow: hidden;
        }
        .sidebar li span { position: relative; z-index: 1; }
        .sidebar li::before {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0; top: 0;
            background: #f8f5ff;
            transform: translateY(100%);
            transition: transform 0.25s ease;
        }
        .sidebar li:hover::before { transform: translateY(0%); }
        .sidebar li:hover { color: #333; }
        .sidebar li.active {
            border-left-color: #AB92F5; color: #444; font-weight: 600;
        }
        .sidebar li.active::before { transform: translateY(0%); }

        /* 内容区 */
        .content-area {
            flex: 1; background: #fff; border: 1px solid #e0d8f0;
            overflow: hidden; height: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .content-area iframe { width: 100%; height: 100%; border: none; display: block; }

        /* 滚动条 */
        .sidebar::-webkit-scrollbar, .content-area::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #d0c4e8; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; padding: 10px; gap: 12px; }
            .sidebar { width: 100%; min-width: unset; height: auto; max-height: 200px; }
            .content-area { height: 420px; min-height: 320px; }
            .header-row { padding: 12px 16px; }
            .logo-area h1 { font-size: 20px; }
            .top-bar a { font-size: 12px; padding: 4px 10px; }
        }
        @media (max-width: 480px) {
            .sidebar li { padding: 8px 16px; font-size: 13px; }
            .content-area { height: 380px; }
        }
    </style>
</head>
<body>

    <div class="header-row">
        <div class="logo-area">
            <img src="../icon.png" alt="Itoc logo" class="logo-img">
            <h1>Itoc 帮助文档</h1>
        </div>
        <div class="top-bar">
            <a href="https://message.bilibili.com/#/whisper/mid3461569935575626" target="_blank"><span>联系作者</span></a>
            <a href="https://miku66ccff.freeflarum.com/t/itoc" target="_blank"><span>交流论坛</span></a>
            <a href="https://github.com/xxdz-Official/xxdz-Itoc" target="_blank"><span>GitHub主页</span></a>
            <a href="../Mode.html"><span>插件市场</span></a>
            <a href="../FriendURL.html"><span>友情链接</span></a>
            <a href="help.html" class="active"><span>帮助文档</span></a>
        </div>
    </div>

    <div class="main-container">
        <nav class="sidebar" id="sidebar">
            <h3>📖 目录</h3>
            <ul id="tocList"></ul>
            <!-- ===== SEO 链接池：所有独立页面入口（小按钮，供爬虫发现） ===== -->
            <div style="margin-top: 16px; padding: 10px 16px; border-top: 1px solid #e0d8f0;">
                <div style="font-size: 11px; color: #999; margin-bottom: 6px; letter-spacing: 1px;">📄 所有页面</div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                    <a href="../OwO.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">主页</a>
                    <a href="help.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">帮助</a>
                    <a href="start.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">初识</a>
                    <a href="install.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">安装</a>
                    <a href="interface.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">界面</a>
                    <a href="quickstart.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">上手</a>
                    <a href="timeline.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">时间轴</a>
                    <a href="czemaker.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">弹窗基础</a>
                    <a href="czemaker_advanced.html" style="font-size: 11px; color: #888; text-decoration: none; padding: 2px 8px; background: #f5f0ff; border-radius: 3px; border: 1px solid #e8dfff;">弹窗进阶</a>
                </div>
            </div>
        </nav>
        <main class="content-area" id="contentArea">
            <iframe id="contentFrame" src=""></iframe>
        </main>
    </div>

    <script>
        (function() {
            const tocList = document.getElementById('tocList');
            const frame = document.getElementById('contentFrame');

            function renderToc(data) {
                const ul = tocList;
                ul.innerHTML = '';
                data.forEach((item) => {
                    const li = document.createElement('li');
                    const span = document.createElement('span');
                    span.textContent = item.title;
                    li.appendChild(span);
                    li.dataset.file = item.file;
                    li.addEventListener('click', function() {
                        const file = this.dataset.file;
                        loadContent(file);
                        document.querySelectorAll('#tocList li').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');
                        window.location.hash = file.replace('.html', '');
                    });
                    ul.appendChild(li);
                });
                const hash = window.location.hash.replace('#', '');
                const targetFile = hash ? hash + '.html' : (data.length ? data[0].file : '');
                if (targetFile && data.some(item => item.file === targetFile)) {
                    loadContent(targetFile);
                } else if (data.length) {
                    loadContent(data[0].file);
                }
            }

            function loadContent(file) {
                if (!file) return;
                frame.src = file;
                document.querySelectorAll('#tocList li').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('#tocList li').forEach(li => {
                    if (li.dataset.file === file) li.classList.add('active');
                });
                // 加载完成后更新页面标题
                updatePageTitle();
            }

            /**
             * 更新页面标题（浏览器标签 + 页面 H1）
             * 从 iframe 内容中提取 h1 标题，拼接成 "Itoc 帮助文档 - 章节名"
             */
            function updatePageTitle() {
                try {
                    const iframe = document.getElementById('contentFrame');
                    if (iframe && iframe.contentDocument) {
                        const h1 = iframe.contentDocument.querySelector('h1');
                        if (h1) {
                            const chapter = h1.textContent.trim();
                            const fullTitle = 'Itoc 帮助文档 - ' + chapter;
                            // 更新浏览器标签标题
                            document.title = fullTitle;
                            // 更新页面内 H1 标题
                            const pageH1 = document.querySelector('.logo-area h1');
                            if (pageH1) {
                                pageH1.textContent = fullTitle;
                            }
                        }
                    }
                } catch (e) {
                    // 跨域或加载中，静默忽略
                }
            }

            // 监听 iframe 加载完成，自动更新标题
            document.getElementById('contentFrame').addEventListener('load', function() {
                updatePageTitle();
            });

            // 监听 hash 变化时也更新标题（兼容直接通过 URL 跳转）
            window.addEventListener('hashchange', function() {
                const hash = window.location.hash.replace('#', '');
                if (hash) {
                    const file = hash + '.html';
                    if (window.TOC_DATA && window.TOC_DATA.some(item => item.file === file)) {
                        loadContent(file);
                    }
                }
            });

            // 加载 toc.js
            const script = document.createElement('script');
            script.src = 'toc.js';
            script.onload = function() {
                if (typeof TOC_DATA !== 'undefined' && TOC_DATA.length > 0) {
                    window.TOC_DATA = TOC_DATA;
                    renderToc(TOC_DATA);
                } else {
                    document.getElementById('tocList').innerHTML = '<li style="color:#999;padding:8px 16px;">目录数据为空</li>';
                }
            };
            script.onerror = function() {
                document.getElementById('tocList').innerHTML = '<li style="color:#d32f2f;padding:8px 16px;">❌ 加载 toc.js 失败，请检查文件是否存在</li>';
                document.getElementById('contentFrame').src = '';
            };
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
