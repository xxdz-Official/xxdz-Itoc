        @media (max-width: 768px) {

        }
        @media (max-width: 560px) {

            }

        .back-link {

            text-decoration: none;
            font-size: 14px;
            padding: 4px 12px;
            border: 1px solid #888;
            background: #fff;

        @media (max-width: 480px) {

        }
        .back-link:hover {

        .download-card {

            }

        @media (max-width: 550px) {

            }

        .software-header {

            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            flex-wrap: wrap;
        }
        .software-icon {

        @media (max-width: 480px) {

        .download-link-btn {

        img {

            height: auto;

    </style>
</head>
