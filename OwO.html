<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itoc 项目主页</title>
    <!-- 添加网页图标 -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <!-- 备用格式确保兼容性 -->
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <!-- 使用 xxdz-Itoc 文件夹下的 web.css -->
    <link rel="stylesheet" href="xxdz-Itoc/web.css">
    <style>
        /* 追加样式 - 直角/主题色 AB92F5 */
        * {
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f0f0f0;
            color: #333;
            line-height: 1.6;
            padding: 20px 30px;
        }
        /* 顶部导航整体布局 */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border: 1px solid #888;
        }
        .logo-area h1 {
            font-size: 28px;
            color: #222;
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .top-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-bar a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
            padding: 5px 12px;
            border: 1px solid #888;
            background: #fff;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
        }
        .top-bar a:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }
        /* 分割线 */
        .divider {
            border-bottom: 2px solid #444;
            margin-bottom: 30px;
        }
        
        .download-banner {
            width: 100%;
            padding: 30px 35px;
            margin: 20px 0 30px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: none;
            background: linear-gradient(145deg, #f0e0ff, #d9b5ff, #c6a0ff);
            background-size: 300% 300%;
            background-position: 0% 50%;
            transition: background-position 0.8s ease;
            background-image: url('itoc启动图.png'), linear-gradient(145deg, #f0e0ff, #d9b5ff, #c6a0ff);
            background-repeat: no-repeat, repeat;
            background-position: left center, 0% 50%;
            background-size: 20% auto, 300% 300%;
            min-height: 200px;
            position: relative;
        }
        .download-banner:hover {
            background-position: left center, 100% 50%;
        }
        .banner-left-spacer {
            width: 320px;
            flex-shrink: 0;
        }
        .banner-text {
            width: fit-content;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px 25px;
            border: none;
            margin-right: 300px;
        }
        .banner-text h2 {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .version-row {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .version-tag {
            font-size: 26px;
            font-weight: 500;
            color: #1e1e1e;
        }
        .download-button {
            display: inline-block;
            background: #fff;
            border: 2px solid #AB92F5;
            padding: 10px 32px;
            font-size: 22px;
            font-weight: 600;
            color: #2b2b2b;
            text-decoration: none;
            transition: 0.15s;
            line-height: 1.2;
        }
        .download-button:hover {
            background: #AB92F5;
            color: #fff;
            border-color: #AB92F5;
        }

        .banner-credit {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 12px;
            color: rgba(51, 51, 51, 0.6);
            font-style: italic;
            margin: 0;
            padding: 2px 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border: none;
        }

        /* 双列布局：每日小技巧 + 开发者模块 */
        .content-row {
            display: flex;
            gap: 20px;
            margin: 20px 0 30px 0;
            width: 100%;
        }
        .daily-trick {
            flex: 2;
            border: 1px solid #aaa;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 280px;
        }
        .trick-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
            background: #f8f8f8;
        }
        .trick-header h3 {
            font-size: 22px;
            color: #222;
            margin: 0;
        }
        .next-trick-btn {
            background: #fff;
            border: 1px solid #888;
            padding: 6px 18px;
            font-size: 15px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .next-trick-btn:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }
        .trick-content {
            padding: 25px 20px;
            background-image: url('每日小技巧.png');
            background-repeat: no-repeat;
            background-position: right bottom;
            background-size: 150px auto;
            min-height: 200px;
            flex: 1;
        }
        .trick-title {
            font-size: 20px;
            font-weight: 600;
            color: #222;
            margin-bottom: 15px;
            border-left: 4px solid #AB92F5;
            padding-left: 15px;
        }
        .trick-text {
            font-size: 16px;
            color: #444;
            line-height: 1.8;
            white-space: pre-line;
            max-width: 70%;
        }
        /* 加载提示样式 */
        .loading-tip {
            font-size: 18px;
            color: #AB92F5;
            padding: 20px;
            text-align: center;
            font-style: italic;
        }
        .loading-tip::after {
            content: "...";
            animation: loadingDots 1.5s infinite;
        }
        @keyframes loadingDots {
            0%, 20% { content: "."; }
            40%, 60% { content: ".."; }
            80%, 100% { content: "..."; }
        }
        /* 打字机光标效果 */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 20px;
            background-color: #AB92F5;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .developer-module {
            flex: 1; /* 占比1/3 */
            border: 1px solid #aaa;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 280px; 
        }
        .dev-header {
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
            background: #f8f8f8;
        }
        .dev-header h3 {
            font-size: 22px;
            color: #222;
            margin: 0;
        }
        .dev-content {
            padding: 20px;
            display: flex;
            flex-direction: row;
            gap: 18px; 
            align-items: center;
            flex: 1;
        }
        .dev-avatar {
            width: 85px;
            height: 85px;
            border: 2px solid #AB92F5;
            object-fit: cover;
            flex-shrink: 0;
        }
        .dev-info {
            display: flex;
            flex-direction: column;
            gap: 10px; 
            flex: 1;
        }
        .dev-name {
            font-size: 20px; 
            font-weight: 600;
            color: #222;
            line-height: 1.3;
        }
        .dev-bio {
            font-size: 13px; 
            color: #666;
            line-height: 1.5;
        }
        .dev-link {
            display: inline-block;
            background: #fff;
            border: 1px solid #888;
            padding: 6px 14px; 
            color: #333;
            text-decoration: none;
            font-size: 13px; 
            transition: all 0.2s;
            width: fit-content;
        }
        .dev-link:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }

        /* 版本列表区域 */
        .version-list {
            width: 100%;
            background: #ffffff;
            border: 1px solid #aaa;
            padding: 20px 25px;
            margin-top: 25px;
        }
        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #bbb;
        }
        .version-item:last-child {
            border-bottom: none;
        }
        .version-name {
            font-size: 22px;
            font-weight: 500;
            color: #222;
        }
        .version-download {
            background: #fff;
            border: 1px solid #666;
            padding: 6px 22px;
            color: #333;
            text-decoration: none;
            font-size: 18px;
        }
        .version-download:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }

        /* 页脚 */
        .footer {
            margin-top: 35px;
            border-top: 1px solid #aaa;
            padding: 18px 0;
            color: #555;
            font-size: 14px;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- 头部: logo + 右上角按钮组 -->
    <div class="header-row">
        <div class="logo-area">
            <img src="icon.png" alt="Itoc logo" class="logo-img">
            <h1>Itoc 编辑器 - 项目主页</h1>
        </div>
        <div class="top-bar">
            <a href="https://message.bilibili.com/#/whisper/mid3461569935575626" target="_blank">联系作者：小小电子xxdz</a>
            <a href="https://miku66ccff.freeflarum.com/t/itoc" target="_blank">Itoc交流论坛</a>
            <a href="https://github.com/xxdz-Official/xxdz-Itoc" target="_blank">GitHub主页</a>
            <a href="Mode.html">前往 Itoc 插件市场</a>
            <!-- 新增友情链接按钮 -->
            <a href="FriendURL.html">友情链接</a>
        </div>
    </div>

    <div class="divider"></div>

    <!-- 下载横幅 -->
    <div class="download-banner">
        <div class="banner-left-spacer"></div>
        <div class="banner-text">
            <h2>下载 Itoc 的最新版本</h2>
            <div class="version-row">
                <span class="version-tag">Itoc v1</span>
                <a href="v1.html" class="download-button">前往下载 &gt;</a>

    <!-- 双列布局：每日小技巧 + 开发者模块 -->
    <div class="content-row">
        <!-- 每日小技巧模块 (左侧，宽度缩小但高度不变) -->
        <div class="daily-trick" id="dailyTrick">
            <div class="trick-header">
                <h3>每天一个小寄巧</h3>
                <button class="next-trick-btn" onclick="showRandomTip()">下一条 ↺</button>
            </div>
            <div class="trick-content">
                <div class="trick-title" id="tipTitle"></div>
                <div class="trick-text" id="tipContent"></div>
            </div>
        </div>

        <!-- 开发者模块 (右侧) -->
        <div class="developer-module">
            <div class="dev-header">
                <h3>关于作者</h3>
            </div>
            <div class="dev-content">
                <img src="https://i0.hdslb.com/bfs/face/87e609940c74ed2e7dcf6b2b19b3029f8e1566e1.jpg@240w_240h_1c_1s_!web-avatar-nav.avif" alt="小小电子xxdz" class="dev-avatar">
                <div class="dev-info">
                    <div class="dev-name">小小电子xxdz</div>
                    <div class="dev-bio">我叫電籽,一只爱好电脑 术曲滴小狼‖XXDZ工作室创始人</div>
                    <a href="https://space.bilibili.com/3461569935575626" target="_blank" class="dev-link">访问主页 →</a>
                </div>

    <!-- 所有版本的列表 -->
    <div class="version-list">
        <h3 style="margin-bottom: 20px; font-size: 24px; border-left: 6px solid #AB92F5; padding-left: 15px;">历史版本下载列表</h3>
        <div class="version-item">
            <span class="version-name">Itoc v1 简体中文版</span>
            <a href="v1.html" class="version-download">前往下载 &gt;</a>
        </div>
    </div>

    <div class="footer">
        © 2026 小小电子xxdz · Itoc
    </div>

    <script>
        // 全局变量
        let tips = [];
        let currentTipIndex = -1;
        let typingTimer = null;

        // 显示加载状态
        function showLoadingState() {
            document.getElementById('tipTitle').textContent = '加载中';
            const contentElement = document.getElementById('tipContent');
            contentElement.innerHTML = '<span class="loading-tip">正在加载捏</span>';
        }

        // 从远程加载JSON数据
        async function loadTips() {
            // 先显示加载状态
            showLoadingState();
            
            try {
                const response = await fetch('https://xxdz-official.github.io/xxdz-Itoc/Every_day_trick.json');
                if (!response.ok) {
                    throw new Error('加载失败');
                }
                tips = await response.json();
                // 加载成功后显示第一条
                if (tips.length > 0) {
                    showRandomTip();
                }
            } catch (error) {
                console.error('加载每日小技巧失败:', error);
                // 加载失败时显示默认提示
                tips = [{
                    "title": "提示加载失败",
                    "content": "无法连接到每日小技巧服务器，请稍后重试。"
                }];
                showRandomTip();
            }
        }

        function showRandomTip() {
            if (tips.length === 0) return;
            
            // 随机选择一条不重复的技巧（尽量不重复）
            let newIndex;
            if (tips.length > 1) {
                do {
                    newIndex = Math.floor(Math.random() * tips.length);
                } while (newIndex === currentTipIndex);
            } else {
                newIndex = 0;
            }
            currentTipIndex = newIndex;
            
            const tip = tips[currentTipIndex];
            document.getElementById('tipTitle').textContent = tip.title || '每日小技巧';
            
            // 打字机效果
            const contentElement = document.getElementById('tipContent');
            const text = tip.content || 'a????暂无内容';
            
            // 清除之前的定时器
            if (typingTimer) {
                clearInterval(typingTimer);
            }
            
            // 清空内容，添加光标
            contentElement.innerHTML = '';
            const cursorSpan = document.createElement('span');
            cursorSpan.className = 'typing-cursor';
            contentElement.appendChild(cursorSpan);
            
            let i = 0;
            const speed = 30; // 打字速度（毫秒/字符）
            
            typingTimer = setInterval(() => {
                if (i < text.length) {
                    // 在光标前插入字符
                    const char = text.charAt(i);
                    const textNode = document.createTextNode(char);
                    contentElement.insertBefore(textNode, cursorSpan);
                    i++;
                } else {
                    clearInterval(typingTimer);
                    typingTimer = null;
                }
            }, speed);
        }

        // 页面加载时加载远程数据
        window.onload = function() {
            loadTips();
        };
    </script>
