<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="msvalidate.01" content="4BAEA6DA804D3EAD53ED426D2BFA8C0B" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Itoc 项目主页</title>
    <meta name="description" content="世界上首个用音乐去'编程'的可视化开发工具！">
    <meta name="keywords" content="Itoc, xxdz_Itoc, 音乐编程, 可视化开发工具, 小小电子xxdz, 電籽, xxdz工作室, 音可">
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Consolas", "Microsoft YaHei", sans-serif;
            color: #333;
            flex-direction: column;
            gap: 24px;
            padding: 20px;
            text-align: center;
        }
        .notice-box {
            background: #fff;
            border: 3px solid #AB92F5;
            padding: 40px 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(171, 146, 245, 0.2);
        }
        .notice-title {
            font-size: 28px;
            font-weight: 700;
            color: #d32f2f;
            margin-bottom: 16px;
        }
        .notice-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        .notice-text {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
        }
        .notice-text .highlight {
            color: #AB92F5;
            font-weight: 600;
        }
        .click-hint {
            margin-top: 20px;
            font-size: 16px;
            color: #999;
            cursor: pointer;
            padding: 12px 24px;
            border: 2px dashed #ccc;
            transition: all 0.3s ease;
            user-select: none;
        }
        .click-hint:hover {
            border-color: #AB92F5;
            background: #f5f0ff;
            color: #AB92F5;
        }
        .click-hint:active {
            transform: scale(0.97);
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #eee;
            border-top-color: #AB92F5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .meta-note {
            margin-top: 16px;
            font-size: 12px;
            color: #bbb;
        }
        .meta-note a {
            color: #AB92F5;
            text-decoration: none;
        }
        .meta-note a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .notice-box { padding: 28px 20px; }
            .notice-title { font-size: 22px; }
            .notice-text { font-size: 16px; }
            .click-hint { font-size: 14px; padding: 10px 16px; }
        }
    </style>
</head>
<body>

    <div class="notice-box">
        <span class="notice-icon">🚫</span>
        <div class="notice-title">此页面已停用</div>
        <div class="loader"></div>
        <div class="notice-text">
            本页面已迁移至新地址（内容不变！）<br>
            正在自动跳转至 <span class="highlight">Itoc 项目主页</span> ...
        </div>
        <div class="click-hint" id="clickHint">
            如果未自动跳转，请点击此处喵~
        </div>
        <div class="meta-note">
            <a href="index.html">直接访问 Itoc 项目主页</a> &nbsp;·&nbsp; 感谢您的支持
        </div>
    </div>

    <script>
        // ===== 自动跳转（延迟1.5秒，让用户看到提示） =====
        var redirectUrl = 'index.html';
        var redirectDelay = 1500;

        var timer = setTimeout(function() {
            window.location.href = redirectUrl;
        }, redirectDelay);

        // ===== 点击任意处立即跳转 =====
        document.addEventListener('click', function(e) {
            clearTimeout(timer);
            window.location.href = redirectUrl;
        });

        // ===== 点击提示按钮跳转（兼容） =====
        document.getElementById('clickHint').addEventListener('click', function(e) {
            e.stopPropagation();
            clearTimeout(timer);
            window.location.href = redirectUrl;
        });

        // ===== 键盘任意键也触发跳转 =====
        document.addEventListener('keydown', function() {
            clearTimeout(timer);
            window.location.href = redirectUrl;
        });
    </script>

</body>
</html>
