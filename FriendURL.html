<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itoc 友情链接</title>
    <!-- 添加个网页图标 -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <!-- 使用相同的 web.css 保持直角/主题色风格噢 -->
    <link rel="stylesheet" href="xxdz-Itoc/web.css">
    <style>
        /* 追加样式 - 仅用于本页布局，保持直角/主题色 AB92F5 */
        * {
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f0f0f0;
            color: #333;
            line-height: 1.4;
            padding: 15px 25px;
        }
        /* 顶部导航 */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 1px solid #888;
        }
        .logo-area h1 {
            font-size: 24px;
            color: #222;
            border-bottom: none;
            margin: 0;
        }
        .back-link {
            color: #333;
            text-decoration: none;
            font-size: 14px;
            padding: 4px 12px;
            border: 1px solid #888;
            background: #fff;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }

        /* 主卡片 - 友情链接 */
        .friend-card {
            width: 100%;
            background: #fff;
            border: 1px solid #aaa;
            padding: 20px 25px;
            margin: 10px 0 20px 0;
        }

        /* 标题行 */
        .friend-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }
        .friend-icon {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #888;
        }
        .friend-header h2 {
            font-size: 28px;
            color: #222;
            margin: 0;
        }

        /* 分格布局 - 类似B站主页？！ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .friend-grid-item {
            border: 1px solid #ddd;
            background: #fafafa;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.2s;
        }
        .friend-grid-item:hover {
            border-color: #AB92F5;
            box-shadow: 0 2px 8px rgba(171, 146, 245, 0.1);
        }

        .friend-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border: 1px solid #888;
            margin-bottom: 12px;
        }

        .friend-name {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 6px;
        }

        /* 备注样式 - 黄色背景 */
        .friend-note {
            font-size: 11px;
            color: #FFF; 
            font-weight: 500;
            background-color: #FFA700;
            padding: 2px 8px;
            margin-bottom: 6px;
        }

        .friend-url {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .friend-link {
            display: inline-block;
            background: #fff;
            border: 1px solid #888;
            padding: 4px 12px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        .friend-link:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }

        /* 空方格占位样式 */
        .grid-placeholder {
            border: 1px dashed #ccc;
            background: #f5f5f5;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: #999;
            font-size: 14px;
        }
        .placeholder-icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        /* 页脚 */
        .footer {
            margin-top: 25px;
            border-top: 1px solid #aaa;
            padding: 12px 0;
            color: #555;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- 顶部导航：返回主页 -->
    <div class="top-nav">
        <div class="logo-area">
            <img src="icon.png" alt="Itoc logo" class="logo-img">
            <h1>Itoc 友情链接</h1>

        <a href="OwO.html" class="back-link">← 返回主页</a>
    </div>

        <!-- 分格布局 -->
        <div class="grid-container">

                <div class="friend-name">爱科技的学生党</div>

            <div class="friend-grid-item">

                <div class="friend-name">紫妈就是个亻</div>

                <a href="https://space.bilibili.com/439220189" class="friend-link" target="_blank">访问主页 →</a>
            </div>
            <!-- 第4个格 - バックアップP -->
            <div class="friend-grid-item">
                <img src="https://i0.hdslb.com/bfs/face/6f2fce7c5f0f8c81bd98cd1eb0dfc2eefc0d5ca6.jpg" alt="バックアップP" class="friend-logo">
                <div class="friend-name">バックアップP</div>
                <div class="friend-note">为音可画赠图</div>
                <div class="friend-url">神秘备份P</div>
                <a href="https://space.bilibili.com/1226073828" class="friend-link" target="_blank">访问主页 →</a>
            </div>
            <!-- 第5个格 -某人十分讲科学 -->
            <div class="friend-grid-item">
                <img src="https://i1.hdslb.com/bfs/face/20f5fa77e9dd408046dc629838d933ff5cde1c78.jpg" alt="某人十分讲科学" class="friend-logo">
                <div class="friend-name">某人十分讲科学</div>
                <div class="friend-note">为项目推广捐助50元</div>
                <div class="friend-url">你好！（先空）</div>
                <a href="https://space.bilibili.com/2079108658" class="friend-link" target="_blank">访问主页 →</a>
            </div>
            <div class="grid-placeholder">
                <div class="placeholder-icon">(lll￢ω￢)</div>
                <div>没呢</div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        © 2026 小小电子xxdz · Itoc · 欢迎助力本项目！
    </div>
</body>
</html>
