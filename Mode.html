<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itoc 插件市场</title>
    <!-- 添加网页图标 -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <!-- 备用格式确保兼容性 -->
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <!-- 使用相同的 web.css 保持直角/主题色风格 -->
    <link rel="stylesheet" href="xxdz-Itoc/web.css">
    <style>
        /* 追加样式 - 仅用于本页布局，保持直角/主题色 AB92F5 */
        * {
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f0f0f0;
            color: #333;
            line-height: 1.4;
            padding: 15px 25px;
        }
        /* 顶部导航 */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 1px solid #888;
        }
        .logo-area h1 {
            font-size: 24px;
            color: #222;
            border-bottom: none;
            margin: 0;
        }
        .back-link {
            color: #333;
            text-decoration: none;
            font-size: 14px;
            padding: 4px 12px;
            border: 1px solid #888;
            background: #fff;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: #AB92F5;
            border-color: #AB92F5;
            color: #fff;
        }

        /* 主卡片 - 插件市场 */
        .market-card {
            width: 100%;
            background: #fff;
            border: 1px solid #aaa;
            padding: 20px 25px;
            margin: 10px 0 20px 0;
        }

        /* 标题行 */
        .market-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }
        .market-icon {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #888;
        }
        .market-title h2 {
            font-size: 28px;
            color: #222;
            margin: 0 0 5px 0;
        }
        .market-title .status-tag {
            font-size: 16px;
            color: #AB92F5;
            border: 1px solid #AB92F5;
            padding: 3px 10px;
            display: inline-block;
        }

        /* 占位提示 - 暂无插件 */
        .placeholder-section {
            border: 1px solid #ddd;
            padding: 40px 20px;
            background: #fafafa;
            text-align: center;
            margin-bottom: 20px;
        }
        .placeholder-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 15px;
        }
        .placeholder-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }
        .placeholder-subtext {
            font-size: 14px;
            color: #999;
        }

        /* 提示信息 - 简洁风格 */
        .info-note {
            margin-top: 15px;
            border: 1px solid #ddd;
            padding: 12px 15px;
            background: #fafafa;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-note span {
            font-size: 14px;
            color: #666;
        }
        .info-note .emoji {
            font-size: 16px;
        }

        /* 页脚 */
        .footer {
            margin-top: 25px;
            border-top: 1px solid #aaa;
            padding: 12px 0;
            color: #555;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- 顶部导航：返回主页 -->
    <div class="top-nav">
        <div class="logo-area">
            <img src="icon.png" alt="Itoc logo" class="logo-img">
            <h1>Itoc 插件市场</h1>
        </div>
        <a href="OwO.html" class="back-link">← 返回主页</a>
    </div>

    <!-- 主卡片 -->
    <div class="market-card">
        <!-- 标题和图标 -->
        <div class="market-header">
            <img src="icon.png" alt="Itoc icon" class="market-icon">
            <div class="market-title">
                <h2>插件市场</h2>
                <span class="status-tag">开发中</span>
            </div>
        </div>

        <!-- 占位区域 - 暂无插件 -->
        <div class="placeholder-section">
            <div class="placeholder-icon">🔌</div>
            <div class="placeholder-text">暂无插件</div>
            <div class="placeholder-subtext">插件市场正在紧锣密鼓地开发中，敬请期待</div>
        </div>

        <!-- 简洁提示 -->
        <div class="info-note">
            <span class="emoji">💡</span>
            <span>目前还没有插件上架，您可以先体验编辑器本身的功能</span>
        </div>
        <div class="info-note" style="margin-top: 8px;">
            <span class="emoji">📮</span>
            <span>插件投稿/建议请联系作者：小小电子xxdz</span>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        © 2026 小小电子xxdz · Itoc
    </div>
</body>
</html>
